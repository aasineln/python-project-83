[project]
name = "hexlet-code"
version = "0.1.0"
description = "Page analyzer project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "gunicorn>=26.0.0",
    "psycopg>=3.3.4",
    "ruff>=0.15.13",
    "validators>=0.35.0",
]

[tool.black]
line-length = 80
target-version = ["py312"]
skip-string-normalization = false