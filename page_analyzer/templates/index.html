{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <h1 class="display-4 mb-4">Анализатор страниц</h1>
        <p class="lead">Бесплатно проверяйте сайты на SEO-пригодность</p>

        <form action="{{ url_for('add') }}" method="post" class="mt-5">
            <div class="input-group mb-3">
                <input type="text"
                       name="url"
                       class="form-control form-control-lg"
                       placeholder="https://www.example.com"
                       required>
                <button class="btn btn-primary btn-lg" type="submit">Проверить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
